<div style="background:#FBF6F0;padding:28px 16px;font-family:'Helvetica Neue',Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto">
    <div style="padding-bottom:16px;border-bottom:1px solid #EDE3D6;line-height:1">
      <div style="font-size:10px;letter-spacing:3px;color:#C4664A;font-weight:600">LOCAL</div>
      <div style="font-size:18px;font-weight:800;color:#1C1917">Current</div>
    </div>
    <p style="margin:20px 0 16px;font-size:24px;font-weight:700;color:#1C1917">Confirm your email</p>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#1C1917">Enter this code in the Local Current app to finish signing up:</p>
    <div style="background:#fff;border:2px dashed #C4664A;border-radius:14px;padding:14px;text-align:center;margin:0 0 16px">
      <div style="font-size:32px;font-weight:800;letter-spacing:6px;color:#C4664A">{{ .Token }}</div>
    </div>
    <p style="margin:0 0 16px;font-size:13px;line-height:1.5;color:#7D6F64">The code expires in 1 hour. If you didn't sign up for Local Current, you can ignore this email.</p>
  </div>
</div>
